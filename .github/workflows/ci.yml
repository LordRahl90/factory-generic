name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install   # reads .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: make lint

      - name: Type check
        run: make type

      - name: Architecture contracts
        run: make arch

      - name: Tests
        run: make test
