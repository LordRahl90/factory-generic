services:
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on:
      ollama: {condition: service_healthy}
    environment: [OLLAMA_HOST=ollama:11434]
    entrypoint: ["ollama", "pull", "qwen2.5-coder:7b"]
    restart: "no"

volumes:
  ollama: {}